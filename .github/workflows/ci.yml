name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linter
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ --ignore E501,W503

  # ---------------------------------------------------------------------------
  # Type Check
  # ---------------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install type checker
        run: pip install pyright

      - name: Run pyright
        run: pyright backend/ --ignoremissingtypes
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pmrs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pmrs_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          DEBUG: "true"
        run: |
          PYTHONPATH=backend pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install pip-audit safety

      - name: Run pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Run safety check
        run: safety check -r requirements.txt
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Docker Build
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pmrs-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend image
        run: |
          docker build -t pmrs-backend:test backend/
          docker run --rm pmrs-backend:test python -c "
          from protocols.modbus_tcp import ModbusTCP
          from protocols.iec61850 import IEC61850Protocol
          from protocols.dnp3 import DNP3Protocol
          from services.cvss import CVSSCalculator
          print('All imports OK')
          "

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: pmrs-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Integration Test
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker-compose up -d postgres redis backend

      - name: Wait for services
        run: |
          sleep 30
          curl -f http://localhost:8000/health || exit 1

      - name: Run integration tests
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8000/api/v1/protocols/

      - name: Cleanup
        if: always()
        run: docker-compose down -v
